services:
  db:
    image: postgres:16-alpine
    container_name: offgrid-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: offgrid
      POSTGRES_PASSWORD: offgrid
      POSTGRES_DB: offgrid
    ports:
      - "5432:5432"
    volumes:
      - offgrid-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offgrid -d offgrid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  offgrid-db-data:
